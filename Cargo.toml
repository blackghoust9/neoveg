[workspace]
resolver = "2"
members = [
    "crates/neoveg_common",
    "crates/neoveg_audio",
    "crates/neoveg_video",
    "crates/neoveg_engine",
    "crates/neoveg_text",
    "crates/neoveg_media",
    "crates/neoveg_h264",
    "crates/neoveg_aac",
    "crates/neoveg_cfb",
    "crates/neoveg_aaf",
    "crates/neoveg_ui",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
authors = ["Neoveg Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
neoveg_common = { path = "crates/neoveg_common" }
neoveg_audio = { path = "crates/neoveg_audio" }
neoveg_video = { path = "crates/neoveg_video" }
neoveg_engine = { path = "crates/neoveg_engine" }
neoveg_text = { path = "crates/neoveg_text" }
neoveg_media = { path = "crates/neoveg_media" }
neoveg_h264 = { path = "crates/neoveg_h264" }
neoveg_aac = { path = "crates/neoveg_aac" }
neoveg_cfb = { path = "crates/neoveg_cfb" }
neoveg_aaf = { path = "crates/neoveg_aaf" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# No debug information in dev and test builds: the symbols of wgpu, egui and the rest are what
# makes linking the interface's test binary need gigabytes (a small machine ran out of memory)
[profile.dev]
debug = 0

# Numeric audio code (loudness meter, mixer) is tested on seconds of signal: keep it optimised even
# in debug builds so `cargo test` stays fast
[profile.dev.package.neoveg_audio]
opt-level = 3

# winit 0.30.13 with one change for Windows (third_party/winit/NEOVEG_PATCH.md): a window dragged
# between monitors of different scale keeps its size and gets the scale at the drop, instead of
# flipping between the two scales and shaking
[patch.crates-io]
winit = { path = "third_party/winit" }
