[package]
name = "neoveg_ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Neoveg application: egui/eframe (wgpu) workspace with dockable panels"

[features]
default = []
# Native video decoding for the preview (needs FFmpeg 7.1 shared libraries, see README)
ffmpeg = ["neoveg_video/ffmpeg"]

[[bin]]
name = "neoveg"
path = "src/main.rs"

[dependencies]
neoveg_common.workspace = true
neoveg_text.workspace = true
neoveg_audio.workspace = true
neoveg_video.workspace = true
neoveg_engine.workspace = true
tracing.workspace = true
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui_dock = { version = "0.14", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
egui_extras = { version = "0.29", default-features = false, features = ["svg", "image"] }
rfd = "0.15"
# Offscreen screenshots (`neoveg --screenshots`): block on wgpu futures and write PNG files
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the Nv icon in the executable (see build.rs)
winres = "0.1"
