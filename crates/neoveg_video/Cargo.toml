[package]
name = "neoveg_video"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Neoveg video: frame buffers, procedural generators, wgpu upload and optional FFmpeg decoding"

[features]
default = []
# Native FFmpeg decoding via shared dynamic linking ONLY (LGPL v2.1+; never enable `static` or `gpl`)
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
neoveg_common.workspace = true
neoveg_text.workspace = true
neoveg_media.workspace = true
neoveg_h264.workspace = true
neoveg_aac.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "tga", "ico", "pnm"] }
wgpu = "22"
# Shared dynamic linking only (`static`, `build`, `build-license-gpl`, `build-license-nonfree` disabled)
ffmpeg-next = { version = "7", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"], optional = true }

[dev-dependencies]
# Benchmarks (`cargo bench -p neoveg_video --bench playback_bench`); no HTML reports, to keep the tree small
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "playback_bench"
harness = false
