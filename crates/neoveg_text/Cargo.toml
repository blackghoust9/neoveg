[package]
name = "neoveg_text"
version.workspace = true
# The code uses let chains, which need the 2024 edition (the rest of the workspace is on 2021)
edition = "2024"
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Neoveg text engine: fonts (bundled and system), shaping, bidi, line breaking, paragraph layout and anti-aliased glyph rasterisation (adapted from FilmCraft)"

[dependencies]
# Font tables, glyph outlines and metrics (MIT OR Apache-2.0). Rasterisation is our own.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# OpenType shaping (HarfBuzz port on read-fonts, MIT); shares font parsing with skrifa.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
# Unicode Bidirectional Algorithm (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# UAX #14 line breaking (Apache-2.0).
unicode-linebreak = "0.1.5"
# UAX #29 extended grapheme clusters (MIT OR Apache-2.0).
unicode-segmentation = "1.13"

[dev-dependencies]
tempfile = "3"
