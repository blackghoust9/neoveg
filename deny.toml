# cargo-deny configuration — Neoveg Clean-Room & Open-Source License Compliance
# Run: cargo deny check licenses bans advisories sources

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Accepted advisories. Each one sits in a dependency that Neoveg does not patch itself, and the
# upgrade it needs is a larger change (egui 0.29 stack, candle 0.11). Remove an entry as soon as
# its crate is upgraded.
ignore = [
    # zip 8.6.0 comes from candle-core (Whisper). The advisory has no safe upgrade. Neoveg only reads
    # entries by name and never calls ZipArchive::extract().
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 via candle-core; Neoveg never calls ZipArchive::extract()" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 via candle-core; Neoveg never calls ZipArchive::extract()" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 via candle-core; Neoveg never calls ZipArchive::extract()" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 via candle-core; Neoveg never calls ZipArchive::extract()" },
    # Unmaintained crates: ttf-parser and paste come from the egui 0.29 stack (and candle for paste);
    # zbus_names, zvariant and zvariant_derive come from the file-dialog stack.
    { id = "RUSTSEC-2024-0436", reason = "paste, via egui_dock and candle; no maintained replacement in those stacks" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via epaint/egui 0.29" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via the file-dialog stack" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via the file-dialog stack" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via the file-dialog stack" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive and weak-copyleft licenses explicitly audited and approved for Neoveg
# (dual-licensed under MIT OR Apache-2.0; FFmpeg linked dynamically under LGPL-2.1-or-later).
# Strong/network copyleft licenses (AGPL-3.0, GPL-2.0, GPL-3.0, SSPL) are listed in `deny` and
# stay out of `allow`, so neither an allowed exception nor a permissive fallback can let them in.
# (`copyleft`, `allow-osi-fsf-free` and `default` were removed from cargo-deny in 0.15; on the
# current versions anything not in `allow` and not raised as an exception is denied.)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "BlueOak-1.0.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OFL-1.1",
    "WTFPL",
    "LGPL-2.1-or-later",
]

# Reject any strong or network copyleft crate by *not* allowing it: since cargo-deny 0.15 a license
# that is neither in `allow` nor raised by a per-crate exception is denied, and the `copyleft`,
# `allow-osi-fsf-free`, `default` and `deny` keys no longer exist.

[[licenses.clarify]]
name = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0"
license-files = []

[[licenses.exceptions]]
allow = ["Ubuntu-font-1.0"]
crate = "epaint_default_fonts"

[bans]
multiple-versions = "warn"
# The only wildcards are the internal `neoveg_*` path dependencies (a path dependency without a
# version is written as `*`); every registry dependency is pinned by `Cargo.lock`.
wildcards = "warn"
highlight = "all"

# Prohibit GPL/AGPL crates and static/GPL FFmpeg builds if anyone attempts to add them.
deny = [
    { crate = "openssl-src", reason = "Use OS native TLS or rustls; avoid bundling OpenSSL C sources" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
