# Neoveg - isolated test and build environment (pure Rust workspace).
#
#   docker compose -f docker/docker-compose.yml up --build                    # Linux: tests, then release build
#   docker compose -f docker/docker-compose.yml --profile macos up --build    # + macOS cross build (needs docker/sdk)
#
# The repository is bind-mounted read-only at /workspace; Cargo output and the registry cache live in
# named volumes; artifacts are written to dist/ (dist/linux, dist/macos, dist/reports).
#
# Prefer scripts/test_rust_crossplatform.sh (or .ps1): it runs the steps in order, checks the results
# and fails with a clear message.
name: neoveg-rust

x-linux-build: &linux-build
  context: .
  dockerfile: Dockerfile.rust-linux
  args:
    RUST_IMAGE: ${RUST_IMAGE:-rust:latest}

x-environment: &environment
  HOST_UID: ${HOST_UID:-0}
  HOST_GID: ${HOST_GID:-0}
  NEOVEG_FFMPEG: ${NEOVEG_FFMPEG:-0}

services:
  # rustfmt + clippy -D warnings + cargo test --workspace, inside Xvfb
  test-rust-linux:
    build: *linux-build
    image: neoveg/rust-linux:local
    command: ["/usr/local/bin/test-linux.sh"]
    environment: *environment
    volumes:
      - ..:/workspace:ro
      - ../dist:/dist
      - cargo-registry:/usr/local/cargo/registry
      - target-linux-test:/target

  # Optimized Linux binaries (only after the tests passed)
  build-rust-linux-release:
    build: *linux-build
    image: neoveg/rust-linux:local
    command: ["/usr/local/bin/build-linux.sh"]
    environment: *environment
    depends_on:
      test-rust-linux:
        condition: service_completed_successfully
    volumes:
      - ..:/workspace:ro
      - ../dist:/dist
      - cargo-registry:/usr/local/cargo/registry
      - target-linux-release:/target

  # Optimized macOS binaries (Intel and Apple Silicon) through osxcross. Needs the macOS SDK package in
  # docker/sdk/, so it only starts with `--profile macos`.
  build-rust-macos-release:
    profiles: ["macos"]
    build:
      context: .
      dockerfile: Dockerfile.rust-macos
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:latest}
        OSXCROSS_REF: ${OSXCROSS_REF:-master}
    image: neoveg/rust-macos:local
    command: ["/usr/local/bin/build-macos.sh"]
    environment: *environment
    depends_on:
      test-rust-linux:
        condition: service_completed_successfully
    volumes:
      - ..:/workspace:ro
      - ../dist:/dist
      - cargo-registry:/usr/local/cargo/registry
      - target-macos:/target

volumes:
  cargo-registry:
  target-linux-test:
  target-linux-release:
  target-macos:
